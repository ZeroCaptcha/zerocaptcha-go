name: Bug
description: Something in this repository does not work as its README says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Leave out your API key and proxy password.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Your operating system and the language, runtime or browser versions.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: From the API's error or its x-request-id header, if there is one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
